name: Test and Release
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: npm
    # This step only executes on the Node 22 runner
    - name: Upgrade npm on Node 22
      if: matrix.node == '22'
      run: npm install -g npm@11
    - run: npm ci --ignore-scripts
    - run: npm install --omit=dev --ignore-scripts
      working-directory: test/fixtures/workspace
    - run: npm run tape

  release:
    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js 26
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
    - run: npm ci
    - run: npm audit signatures
    - run: npm run semantic-release
      env:
        GITHUB_TOKEN: ${{ github.token }}
